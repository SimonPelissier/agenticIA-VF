# Mise à jour des votes, chaque nuit : l'agent de collecte télécharge les scrutins de l'Assemblée,
# les compare à ceux déjà publiés (agents/collecte/controles.py), puis les écrit dans Supabase,
# que lit le site. Plus de pull request ni de fichier dans le dépôt (décision du 5 novembre 2026).
# Si un contrôle échoue, rien n'est écrit : la tâche apparaît en rouge et GitHub prévient par e-mail.
# Secrets nécessaires (Settings → Secrets and variables → Actions) : SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY.
# La veille médias (articles et déclarations) est faite par la routine Claude Code quotidienne.
name: Agent de collecte

on:
  schedule:
    - cron: "30 4 * * *"   # chaque jour à 4 h 30 UTC (GitHub la lance souvent avec du retard)
  workflow_dispatch:        # bouton « Run workflow » dans l'onglet Actions

permissions:
  contents: read

concurrency:
  group: collecte
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lancer l'agent de collecte (votes de l'Assemblée)
        run: |
          python3 agents/collecte/collecte.py
          echo "Chiffres de la collecte :"
          cat data/collecte.json
          echo "Empreintes SHA-256 des archives téléchargées :"
          cat agents/collecte/.cache/empreintes.json

      - name: Contrôler les données (comparaison avec Supabase)
        run: python3 agents/collecte/controles.py

      - name: Écrire les votes dans Supabase
        # Les scrutins des 60 derniers jours, tous les grands votes, et les données prêtes pour le site.
        run: python3 agents/supabase/importer.py --recents 60
